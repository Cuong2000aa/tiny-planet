<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="planetGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4fd1c5" />
      <stop offset="60%" stop-color="#319795" />
      <stop offset="100%" stop-color="#1d4044" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Space -->
  <rect width="128" height="128" rx="28" fill="#131722" />
  <!-- Stars -->
  <circle cx="24" cy="28" r="1.5" fill="#fbd38d" />
  <circle cx="106" cy="22" r="2" fill="#bee3f8" />
  <circle cx="18" cy="98" r="1.5" fill="#bee3f8" />
  <circle cx="112" cy="102" r="1.5" fill="#fbd38d" />
  <!-- Planet Body -->
  <circle cx="64" cy="68" r="42" fill="url(#planetGrad)" />
  <!-- Planet Ring -->
  <ellipse cx="64" cy="68" rx="56" ry="16" fill="none" stroke="#f6e05e" stroke-width="5" stroke-linecap="round" opacity="0.85" transform="rotate(-18 64 68)" />
  <!-- B.O.T Mascot head popping up -->
  <ellipse cx="64" cy="46" rx="18" ry="16" fill="#f7fafc" stroke="#e2e8f0" stroke-width="2" />
  <!-- Antennas -->
  <circle cx="64" cy="25" r="4" fill="#00f5d4" filter="url(#glow)" />
  <line x1="64" y1="29" x2="64" y2="33" stroke="#cbd5e0" stroke-width="3" stroke-linecap="round" />
  <!-- Visor -->
  <rect x="52" y="42" width="24" height="10" rx="5" fill="#1a202c" />
  <!-- Cyan Glowing Eyes -->
  <circle cx="58" cy="47" r="2.5" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="70" cy="47" r="2.5" fill="#00f5d4" filter="url(#glow)" />
</svg>
